<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d19">
<title>RAKESH PC — Desktop</title><link rel="stylesheet" href="desktop.css">
</head>
<body>
<div class="desktop" id="desktop">
  <div class="rotate-device-hint" aria-live="polite"><span class="rotate-symbol">⟳</span><b>ફોન આડો ફેરવો</b><small>RAKESH PC માટે Landscape 16:9 મોડ</small></div>
  <div class="desktop-shade"></div>
  <header class="desktop-header"><div class="pc-brand"><span class="brand-logo">R</span><span>RAKESH PC</span></div><div class="header-center">PERSONAL WORKSPACE</div><div class="header-user"><i class="online-dot"></i><span id="user-email">Loading account...</span><button id="logout-button" class="quiet-button">Sign out ↗</button></div></header>
  <main class="desktop-area" id="desktop-area">
    <div class="desktop-icons" id="desktop-icons">
      <button class="desktop-icon" data-app="file"><span class="desk-glyph folder-glyph">📁</span><span>This PC</span></button>
      <button class="desktop-icon" data-app="chrome"><span class="desk-glyph">🌐</span><span>Chrome</span></button>
      <button class="desktop-icon" data-app="gmail"><span class="desk-glyph">✉️</span><span>Gmail</span></button>
      <button class="desktop-icon" data-app="github"><span class="desk-glyph">⌘</span><span>GitHub</span></button>
      <button class="desktop-icon" data-app="chatgpt"><span class="desk-glyph">✳</span><span>ChatGPT</span></button>
      <button class="desktop-icon" data-app="angel"><span class="desk-glyph">📈</span><span>Angel One</span></button>
      <button class="desktop-icon" data-app="codemagic"><span class="desk-glyph">⚡</span><span>Codemagic</span></button>
      <button class="desktop-icon" data-app="notes"><span class="desk-glyph">📝</span><span>Notes</span></button>
      <button class="desktop-icon" data-app="calculator"><span class="desk-glyph">🧮</span><span>Calculator</span></button>
      <button class="desktop-icon" data-app="settings"><span class="desk-glyph">⚙️</span><span>Settings</span></button>
    </div>
    <div class="quick-launch"><button data-app="file"><b>📁</b><span>File Manager</span></button><button data-app="notes"><b>📝</b><span>Quick Notes</span></button><button data-app="calculator"><b>🧮</b><span>Calculator</span></button><button data-app="settings"><b>⚙️</b><span>Settings</span></button></div>
  </main>
  <section class="start-menu" id="start-menu" aria-hidden="true">
    <div class="start-top"><div class="start-avatar">R</div><div><strong>RAKESH PC</strong><small id="start-email">Personal account</small></div><button id="start-power" title="Sign out">⏻</button></div>
    <div class="start-search">⌕ <input id="app-search" type="search" placeholder="Search apps and tools" autocomplete="off"></div><div class="start-label">Pinned applications</div>
    <div class="start-apps">
      <button data-app="chrome"><b>🌐</b>Chrome</button><button data-app="gmail"><b>✉️</b>Gmail</button><button data-app="github"><b>⌘</b>GitHub</button><button data-app="chatgpt"><b>✳</b>ChatGPT</button><button data-app="angel"><b>📈</b>Angel One</button><button data-app="codemagic"><b>⚡</b>Codemagic</button><button data-app="file"><b>📁</b>File Manager</button><button data-app="notes"><b>📝</b>Notes</button><button data-app="calculator"><b>🧮</b>Calculator</button><button data-app="settings"><b>⚙️</b>Settings</button>
    </div>
    <div class="start-bottom"><span>RAKESH PC · Desktop</span><button id="start-logout">Sign out ↗</button></div>
  </section>
  <div class="window-layer" id="window-layer"></div>
  <footer class="taskbar">
    <button class="task-start" id="start-button" aria-label="Open Start menu"><span class="windows-mark">⊞</span></button>
    <button class="task-search" id="task-search">⌕ <span>Search</span></button>
    <div class="task-pins"><button data-app="file" title="File Manager">📁</button><button data-app="chrome" title="Chrome">🌐</button><button data-app="gmail" title="Gmail">✉️</button><button data-app="notes" title="Notes">📝</button><button data-app="calculator" title="Calculator">🧮</button></div>
    <div class="task-spacer"></div><div class="system-tray"><span title="Network">◉</span><span title="Volume">🔊</span><span title="Battery">▰</span><div class="clock"><strong id="clock-time">--:--</strong><small id="clock-date">---</small></div></div>
  </footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="desktop.js"></script>
</body></html>
