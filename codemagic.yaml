workflows:
  rakesh-pc-android:
    name: RAKESH PC - Android APK
    # Personal free plans include 500 build minutes/month on macOS M2.
    # Linux instances require billing to be enabled.
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      java: 17

    scripts:
      - name: Check Android project
        script: |
          test -f android-app/settings.gradle
          test -f android-app/app/build.gradle
          gradle --version

      - name: Build release APK
        script: |
          gradle -p android-app --no-daemon assembleRelease

    artifacts:
      - android-app/app/build/outputs/apk/release/*.apk
