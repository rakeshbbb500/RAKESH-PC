workflows:
  rakesh-pc-android:
    name: RAKESH PC - Android Test APK
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      java: 17

    scripts:
      - name: Check Android project
        script: |
          test -f android-app/settings.gradle
          test -f android-app/app/build.gradle
          gradle --version

      - name: Build signed debug APK
        script: |
          set -e
          gradle -p android-app --no-daemon assembleDebug
          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK file details:"
          ls -lh "$APK"
          file "$APK"
          echo "APK archive check:"
          unzip -t "$APK" | tail -n 2

    artifacts:
      - android-app/app/build/outputs/apk/debug/app-debug.apk
